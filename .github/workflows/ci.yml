name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Copilot worker dependencies
        run: npm ci --prefix services/copilot-worker

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run type-check

      - name: Build Copilot worker
        run: npm run worker:build

      - name: Build Copilot worker container
        run: docker build --file services/copilot-worker/Dockerfile.vercel services/copilot-worker

      - name: Build
        run: npm run build
        env:
          # Dummy values so `next build` can statically render/validate
          # pages that read env vars at build time. Real secrets are only
          # needed at runtime (Vercel env vars), not for CI build checks.
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_SUPABASE_ANON_KEY: "placeholder-anon-key"
          SUPABASE_SERVICE_ROLE_KEY: "placeholder-service-role-key"
          SUPABASE_SCHEMA: "carcanhol"
          LLM_CREDENTIAL_ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          LLM_CREDENTIAL_ENCRYPTION_KEY_VERSION: "ci-placeholder"
          COPILOT_WORKER_URL: "https://copilot-worker.internal.example"
          COPILOT_WORKER_HMAC_SECRET: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          COPILOT_WORKER_TIMEOUT_MS: "30000"
